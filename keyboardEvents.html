<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>
    <style>
        body{
            font-family:'Times New Roman', Times, serif;
            background-size: auto;
            background-position: 0cap;
        }
        #form{
            text-align: center;
            width:auto;
            margin:100px auto 0 auto;
            border: 2px solid rgb(51, 37, 245);
            border-radius: 15px;
            padding:25px;
            background-color:rgb(144, 213, 240);
            color:blue;
            box-shadow:-3px 3px 10px #000
        }
        p,input{
            font-size: 20px;
        }
        input{
            width:300px;
            border:1px solid #000;
            border-radius: 10px;
            background-color: white;
            box-shadow: inset -3px 3px 10px #000;
        }
    </style>
</head>
<body>
    <div id="form">
        <h1 id="h1">Keyboard Events</h1>
        <p> onkeydown</p>
        <input type ="text" onkeydown="alert(this.value);">
        <p>onkeyup</p>
        <input type ="text" onkeyup="alert(this.value);">
        <p> onkeypress</p>
        <input type ="text" onkeypress="alert(this.value);">

        <p> onkeydown</p> 
        <input type ="text" onkeydown="document.getElementById('form').style.background=this.value">
        <p>onkeyup</p>
        <input type ="text" onkeyup="document.getElementById('form').style.background=this.value">
        <p> onkeypress</p>
        <input type ="text" onkeypress="document.getElementById('form').style.background=this.value">

    </div>
    
</body>
</html>
