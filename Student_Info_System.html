<!DOCTYPE html>
<html>
<head>
  <title>Student Information System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
      align-content: center;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    input {
      margin: 5px;
      padding: 8px;
      width: 90%;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .output {
      margin-top: 15px;
      padding: 10px;
      background: #eee;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Information System</h2>
    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll No">
    <input type="number" id="m1" placeholder="Marks in Subject 1">
    <input type="number" id="m2" placeholder="Marks in Subject 2">
    <input type="number" id="m3" placeholder="Marks in Subject 3">
    <input type="number" id="m4" placeholder="Marks in Subject 4">
    <input type="number" id="m5" placeholder="Marks in Subject 5">
    <button onclick="calculate()">Generate Result</button>

    <div class="output" id="result"></div>
  </div>

  <script>
    function calculate() {
      let name = document.getElementById("name").value;
      let roll = document.getElementById("roll").value;
      let marks = [
        parseFloat(document.getElementById("m1").value) || 0,
        parseFloat(document.getElementById("m2").value) || 0,
        parseFloat(document.getElementById("m3").value) || 0,
        parseFloat(document.getElementById("m4").value) || 0,
        parseFloat(document.getElementById("m5").value) || 0
      ];

      let total = marks.reduce((a,b) => a+b, 0);
      let percentage = total / 5;

      let grade, result;
      if (percentage >= 90) grade = "A+";
      else if (percentage >= 75) grade = "A";
      else if (percentage >= 60) grade = "B";
      else if (percentage >= 50) grade = "C";
      else grade = "D";

      result = marks.every(m => m >= 33) ? "Pass" : "Fail";

      document.getElementById("result").innerHTML = `
        <strong>Name:</strong> ${name}<br>
        <strong>Roll No:</strong> ${roll}<br>
        <strong>Total Marks:</strong> ${total}<br>
        <strong>Percentage:</strong> ${percentage.toFixed(2)}%<br>
        <strong>Grade:</strong> ${grade}<br>
        <strong>Result:</strong> ${result}
      `;
    }
  </script>
</body>
</html>
